<!DOCTYPE html>
<html lang="id" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>AI Story Generator — KreatorHub</title>
<meta name="google-site-verification" content="KCP7oIVcMGBj-562M0-17TOQTb08VqAHyn9xyszXQQ0" />
<meta name="description" content="Ubah ide jadi naskah, alur cerita, dan prompt visual untuk video AI.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={darkMode:'class',theme:{extend:{fontFamily:{sans:['Plus Jakarta Sans','sans-serif']}}}}</script>
<style>@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}</style>
</head>
<body class="bg-black text-neutral-100 font-sans" style="padding-bottom:calc(5rem + env(safe-area-inset-bottom))">
<header class="max-w-xl mx-auto flex items-center justify-between px-4 h-14"><a href="/" class="font-extrabold text-lg">Kreator<span class="text-amber-500">Hub</span></a></header>
<main class="max-w-xl mx-auto px-4 space-y-4">
  <div><h1 class="text-2xl font-bold">Story AI</h1><p class="text-xs text-neutral-400 mt-1">Ubah ide jadi naskah dan prompt visual per scene, lalu kirim ke Video AI.</p></div>
  <div><label for="mode" class="block text-xs font-bold text-neutral-300 mb-1.5">Format</label>
  <select id="mode" class="w-full p-3.5 rounded-2xl bg-neutral-900 border border-neutral-800 text-sm outline-none focus:border-amber-500">
    <option value="recap">Alur Cerita &amp; Film Recap Sinematik</option><option value="survival">Film Pendek AI / Survival &amp; Sci-Fi</option>
    <option value="misteri">Dokumenter Misteri &amp; Teori Konspirasi</option><option value="fakta">Edukasi Fakta Unik</option></select></div>
  <div><label for="inp" class="block text-xs font-bold text-neutral-300 mb-1.5">Topik atau ringkasan cerita</label>
  <textarea id="inp" rows="5" maxlength="8000" placeholder="Contoh: Seorang astronot terjebak di stasiun luar angkasa yang tiba-tiba tidak merespons Bumi…" class="w-full p-3.5 rounded-2xl bg-neutral-900 border border-neutral-800 text-sm placeholder-neutral-600 outline-none focus:border-amber-500"></textarea></div>
  <button id="go" type="button" class="w-full py-4 rounded-2xl bg-gradient-to-r from-amber-500 to-amber-700 text-black text-sm font-extrabold disabled:opacity-60">Buat naskah</button>
  <p id="st" role="status" class="text-xs text-neutral-400"></p>
  <div id="out" class="space-y-3"></div>
  <a href="/#video-analysis" class="block rounded-2xl bg-neutral-900 border border-neutral-800 p-4 text-xs"><b class="text-sm">Analisis video →</b><br><span class="text-neutral-400">Punya video referensi? Analisis dulu, lalu susun ceritanya di sini.</span></a>
</main>
<div id="toast" role="status" class="fixed top-4 left-1/2 -translate-x-1/2 z-[60] hidden max-w-[90%] bg-neutral-800 border border-amber-500/40 px-4 py-2 rounded-full text-xs font-semibold"></div>
<nav class="fixed inset-x-0 bottom-0 z-40 border-t border-neutral-800 bg-neutral-950" style="padding-bottom:env(safe-area-inset-bottom)" aria-label="Menu utama"><div class="max-w-xl mx-auto grid grid-cols-5 h-14 text-[10px] font-semibold">
<a href="/" class="flex flex-col items-center justify-center gap-0.5 text-neutral-400"><span class="text-base">🏠</span>Beranda</a>
<a href="/video-generator" class="flex flex-col items-center justify-center gap-0.5 text-neutral-400"><span class="text-base">🎬</span>Video AI</a>
<a href="/story" aria-current="page" class="flex flex-col items-center justify-center gap-0.5 text-amber-400"><span class="text-base">📝</span>Story AI</a>
<a href="/chat" class="flex flex-col items-center justify-center gap-0.5 text-neutral-400"><span class="text-base">💬</span>Chat</a>
<a href="/video-generator#/akun" class="flex flex-col items-center justify-center gap-0.5 text-neutral-400"><span class="text-base">👤</span>Akun</a></div></nav>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="auth.js"></script>
<script>
const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let B=[];
function toast(t){const e=$('toast');e.textContent=t;e.classList.remove('hidden');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.add('hidden'),2500)}
$('go').onclick=async()=>{
  const input=$('inp').value.trim();if(!input){toast('Tulis topik dulu.');return}
  $('go').disabled=true;$('st').textContent='AI sedang menyusun naskah…';$('out').innerHTML='';
  try{
    const r=await fetch('/.netlify/functions/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mode:$('mode').value,input})});
    const d=await r.json().catch(()=>({}));if(!r.ok||!d.text)throw Error(d.error||'AI tidak mengembalikan naskah.');
    B=d.text.split(/\n{2,}/).map(x=>x.trim()).filter(Boolean);
    $('out').innerHTML=B.map((b,i)=>'<div class="rounded-2xl bg-neutral-900 p-4"><div class="text-xs leading-relaxed whitespace-pre-wrap">'+esc(b)+'</div><div class="flex gap-2 mt-3"><button type="button" data-c="'+i+'" class="flex-1 py-2.5 rounded-xl bg-neutral-800 text-[11px] font-semibold">Salin</button><button type="button" data-v="'+i+'" class="flex-1 py-2.5 rounded-xl bg-amber-500 text-black text-[11px] font-bold">Pakai di Video AI</button></div></div>').join('');
    $('st').textContent='Selesai. Pilih bagian prompt visual lalu kirim ke Video AI.';
  }catch(e){$('st').textContent='Belum bisa: '+e.message}
  finally{$('go').disabled=false}
};
$('out').onclick=async e=>{const b=e.target.closest('button');if(!b)return;
  if(b.dataset.c!==undefined){try{await navigator.clipboard.writeText(B[+b.dataset.c]);toast('Tersalin.')}catch{toast('Gagal menyalin. Tahan dan salin manual.')}}
  if(b.dataset.v!==undefined){try{localStorage.setItem('kh_vprompt',B[+b.dataset.v].slice(0,2000))}catch{}location.href='/video-generator'}};
</script>
</body>
</html>
